/* ---------- router + render ---------- */
let current = 'home', animateNext = true;
function settingsView(){
  const mode = S.mode || 'system';
  return backLink('home','Home') + pageHead('Settings', 'Make the app look the way you like. Saved on this device.') + `
  <section class="card stack" style="margin-top:14px">
    <div><h3>Appearance</h3><p class="note" style="margin:2px 0 0">Auto follows your phone's setting.</p></div>
    <div class="seg" role="radiogroup" aria-label="Appearance">
      ${[['system','Auto'],['light','Light'],['dark','Dark']].map(o => `<button type="button" role="radio" aria-checked="${mode === o[0]}" data-a="setmode" data-v="${o[0]}">${o[1]}</button>`).join('')}
    </div>
  </section>
  ${S.account && !S.test ? `<section class="card" style="margin-top:12px"><h3>Your name</h3><p class="note" style="margin:2px 0 10px">What the app calls you. Stays on this phone.</p>
    <form id="nickForm" class="stack" autocomplete="off" novalidate><label class="field"><span>Name</span><input type="text" id="nickIn" maxlength="20" value="${esc(S.nick || '')}" placeholder="First name or nickname"></label><button class="btn small" type="submit">Save</button></form></section>` : ''}
  <section class="card" style="margin-top:12px">
    <div class="setrow"><div class="grow"><h3>Canna theme</h3><p class="note" style="margin:0">Rasta red, gold and green with leaves all over. Works in light and dark.</p><span class="rasta-chip" aria-hidden="true"></span></div>
    <button type="button" class="switch" role="switch" aria-checked="${!!S.canna}" aria-label="Canna theme" data-a="setcanna"></button></div>
  </section>`;
}
function syncPd(){
  const f = document.getElementById('pdFrame'); if(!f) return;
  const set = () => { try{ const r = f.contentDocument.documentElement; if(S.mode === 'light' || S.mode === 'dark') r.setAttribute('data-theme', S.mode); else r.removeAttribute('data-theme'); }catch(e){} };
  f.addEventListener('load', set);
}
function route(){
  clearTimers(); current = (location.hash || '#home').slice(1) || 'home';
  if(['game-quiz','game-myth','game-dose','game-label'].indexOf(current) >= 0) Q = null;
  if(current === 'game-memory') M = null;
  PK = null; jokeOpen = false; animateNext = true; if(current !== 'journal' && current !== 'passport') resetJ();
  render(); window.scrollTo(0,0);
}
function countUp(){
  if(typeof requestAnimationFrame !== 'function' || (typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  document.querySelectorAll('.count').forEach(el => { const to = +el.dataset.to; if(!to) return; const t0 = performance.now();
    const step = now => { const p = Math.min(1, (now - t0) / 900); el.textContent = fmt(Math.round(to * (1 - Math.pow(1 - p, 3)))); if(p < 1) requestAnimationFrame(step); };
    el.textContent = '0'; requestAnimationFrame(step); });
}
function render(){
  let html;
  if(current.startsWith('lesson-')) html = lessonView(parseInt(current.slice(7),10));
  else html = ({home:homeView, deals:dealsView, rewards:rewardsView, badges:badgesView, journal:journalView, passport:journalView, settings:settingsView, phenodex:phenodexView, 'owner-preview':ownerView, learn:learnView, play:playView, daily:dailyView,
    'game-quiz':()=>quizView('quiz'), 'game-myth':()=>quizView('myth'), 'game-dose':()=>quizView('dose'), 'game-label':()=>quizView('label'), 'game-memory':memView, 'game-dash':dashView,
    'quiz-budtender':()=>pickView('budtender'), 'quiz-flavor':()=>pickView('flavor'), about:aboutView}[current] || homeView)();
  const view = document.getElementById('view'); view.innerHTML = html;
  if(animateNext){ view.classList.add('enter'); if(view.children) Array.prototype.forEach.call(view.children, (c, i) => c.style.setProperty('--i', Math.min(i, 9))); countUp(); }
  else view.classList.remove('enter');
  animateNext = false;
  if(document.body && document.body.classList) document.body.classList.toggle('pdmode', current === 'phenodex');
  if(current === 'phenodex') syncPd();
  const active = current === 'phenodex' ? 'learn' : current.startsWith('lesson-') ? 'learn' : (current.startsWith('game-') || current.startsWith('quiz-')) ? 'play' : ['badges','journal','passport'].includes(current) ? 'rewards' : current === 'daily' ? 'home' : current;
  document.getElementById('tabs').innerHTML = TABS.map(t => `<a class="tab" href="#${t[0]}" ${t[0]===active?'aria-current="page"':''}>${ico(t[2])}<span>${t[1]}</span></a>`).join('');
}

/* ---------- events ---------- */
function resetJ(){ J = {open:false, id:null, name:'', brand:'', fav:false, how:-1, rating:0, notes:'', del:null}; }
function readJ(){ const n = document.getElementById('jName'), t = document.getElementById('jNotes'), br = document.getElementById('jBrand'); if(br) J.brand = br.value; if(n) J.name = n.value; if(t) J.notes = t.value; }
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-a]'); if(!el) return;
  const a = el.dataset.a, v = el.dataset.v;
  if(a === 'nolink'){ toast('Link not set yet. Add it in the CONFIG block.'); return; }
  if(a === 'day'){ dealDay = +v; render(); return; }
  if(a === 'checkin'){ checkIn(); return; }
  if(a === 'joke'){ jokeOpen = true; award('joke', 5, true); persist(); render(); flush(); return; }
  if(a === 'dq'){ dqAnswer(+v); return; }
  if(a === 'lans'){ LS.ans[el.dataset.q] = +v; const l = LESSONS.find(x => x.id === LS.id), n = l.q.length;
    if(Object.keys(LS.ans).length === n){ const sc = l.q.filter((q,i) => LS.ans[i] === q.a).length;
      if(sc >= passMark(l) && !S.lessons[l.id]){ S.lessons[l.id] = Date.now(); award('lesson-' + l.id, 25); bumpWeek('lessons'); }
      if(sc === n && !S.lessonPerfect[l.id]){ S.lessonPerfect[l.id] = 1; award('lesson-perfect-' + l.id, 10); }
      checkBadges(); }
    render(); return; }
  if(a === 'lretry'){ LS.ans = {}; render(); return; }
  /* journal */
  if(a === 'jnew'){ resetJ(); J.open = true; render(); return; }
  if(a === 'jcancel'){ resetJ(); render(); return; }
  if(a === 'jhow'){ readJ(); J.how = +v; render(); return; }
  if(a === 'setmode'){ S.mode = v; persist(); applyTheme(); render(); return; }
  if(a === 'setcanna'){ S.canna = !S.canna; persist(); applyTheme(); render(); toast(S.canna ? 'Canna theme on' : 'Canna theme off'); return; }
  if(a === 'jformfav'){ readJ(); J.fav = !J.fav; render(); return; }
  if(a === 'jfav'){ const en = S.journal.find(x => x.id === +v); if(!en) return; en.fav = !en.fav; if(en.fav) en.favAt = Date.now(); persist(); render(); toast(en.fav ? 'Added to favorites' : 'Removed from favorites'); return; }
  if(a === 'jstar'){ readJ(); J.rating = (J.rating === +v) ? 0 : +v; render(); return; }
  if(a === 'jedit'){ const en = S.journal.find(x => x.id === +v); if(!en) return;
    J = {open:true, id:en.id, name:en.name, brand:en.brand || '', fav:!!en.fav, how:METHODS.findIndex(m => m[0] === en.how), rating:en.rating, notes:en.notes || '', del:null}; render(); window.scrollTo(0, 0); return; }
  if(a === 'jdel'){ J.del = +v; render(); return; }
  if(a === 'jdelno'){ J.del = null; render(); return; }
  if(a === 'jdelyes'){ S.journal = S.journal.filter(x => x.id !== +v); J.del = null; persist(); render(); toast('Entry deleted'); return; }
  /* games */
  if(a === 'qstart'){ quizStart(v, el.dataset.cat || '', +el.dataset.n || 5); render(); return; }
  if(a === 'qmenu'){ Q = null; render(); return; }
  if(a === 'qpick'){ if(Q.pick !== null) return; Q.pick = +v; if(Q.list[Q.i].o[Q.pick].ok) Q.score++; render(); return; }
  if(a === 'qnext'){
    if(Q.i < Q.n - 1){ Q.i++; Q.pick = null; }
    else { Q.fin = true; const K = QKINDS[Q.kind], mara = Q.kind === 'quiz' && Q.n > 5; S.played[Q.kind] = 1;
      if(mara) S.marathonBest = Math.max(S.marathonBest, Q.score); else S[K.field] = Math.max(S[K.field], Q.score);
      if(Q.kind === 'quiz'){ S.triviaRight += Q.score; if(Q.cat) S.triviaCats[Q.cat] = 1; }
      if(award('game-' + Q.kind, 20, true)) bumpWeek('games');
      if(Q.score === Q.n) award('perfect-' + Q.kind, 30, true);
      if(mara) award('marathon', 40, true);
      checkBadges(); }
    render(); return; }
  if(a === 'mstart'){ memStart(); render(); return; }
  if(a === 'mflip'){ const id = +v, c = M.cards[id]; if(M.lock || M.fin || M.open.includes(id) || M.done.includes(c.k)) return;
    M.open.push(id);
    if(M.open.length === 2){ M.moves++; const [x,y] = M.open.map(i => M.cards[i]);
      if(x.k === y.k){ M.done.push(x.k); M.open = [];
        if(M.done.length === M.pairs.length){ M.fin = true; S.played.memory = 1; S.memBest = S.memBest ? Math.min(S.memBest, M.moves) : M.moves;
          if(award('game-memory', 20, true)) bumpWeek('games'); checkBadges(); } }
      else { M.lock = true; timers.push(setTimeout(() => { if(!M) return; M.open = []; M.lock = false; if(current === 'game-memory') render(); }, 800)); } }
    render(); return; }
  if(a === 'dstart'){ dashRun(); return; }
  if(a === 'leaf'){ if(!D || D.fin) return; D.score += +v; const s = document.getElementById('dScore'); if(s) s.textContent = D.score;
    const ar = document.getElementById('arena'); if(ar && document.createElement){ const p = document.createElement('span'); p.className = 'pop' + (+v === 3 ? ' gold' : ''); p.textContent = '+' + v; p.style.left = el.style.left; p.style.top = el.style.top; ar.appendChild(p); timers.push(setTimeout(() => p.remove(), 650)); }
    el.remove(); return; }
  if(a === 'noop') return;
  if(a === 'celenext'){ cele.shift(); showCele(); return; }
  if(a === 'celebadges'){ cele = []; showCele(); location.hash = '#badges'; return; }
  /* quizzes */
  if(a === 'pstart'){ pickStart(v); render(); return; }
  if(a === 'ppick'){ const staff = PK.kind === 'budtender', QS = staff ? STAFFQ : FLAVQ, opt = QS[PK.i].o[+v];
    PK.ans.push(staff ? opt[1] : +v); PK.i++;
    if(PK.i >= QS.length){ PK.fin = true;
      if(staff){ PK.result = staffResult(PK.ans); S.budtender = PK.result; award('bq', 15, true); }
      else { S.flavor = {aroma:PK.ans[0], fmt:PK.ans[1]}; award('fq', 15, true); }
      checkBadges(); }
    render(); return; }
  /* account */
  if(a === 'resend'){ const r = await ALPINE.start(SI.phone); toast(r && r.ok ? 'New code sent' : ((r && r.message) || 'Could not send')); return; }
  if(a === 'changephone'){ SI = {step:'phone', phone:''}; render(); return; }
  if(a === 'refresh'){ toast('Refreshing...'); const r = await ALPINE.refresh();
    if(r && r.ok){ applyAccount(r); render(); toast('Points updated'); }
    else if(r && (r.needCode || r.expired)){ S.token = null; S.account = null; persist(); SI = {step:'phone', phone:''}; render(); toast('Please sign in again'); }
    else toast((r && r.message) || 'Could not refresh'); return; }
  if(a === 'install' && deferredInstall){ deferredInstall.prompt(); try{ await deferredInstall.userChoice; }catch(x){} deferredInstall = null; render(); return; }
  if(a === 'nickskip'){ S.nickAsked = true; persist(); render(); return; }
  if(a === 'hideinstall'){ S.hideInstall = true; persist(); render(); return; }
  if(a === 'teston'){ const d = new Date(); d.setDate(d.getDate() - 240);
    Object.assign(S, {test:true, balance:640, lifetime:1850, redeemed:0, purchases:7, fullLimits:0, joined:d.toISOString()}); persist(); checkBadges(); render(); return; }
  if(a === 'testoff' || a === 'signout'){ Object.assign(S, {test:false, dayOffset:0, account:null, token:null, avail:{}, flags:{}, rewards:[], hidePoints:false, nick:'', nickAsked:false, updated:null, balance:0, lifetime:0, redeemed:0, purchases:0, fullLimits:0, joined:null});
    ACCT.forEach(g => BADGES.filter(b => b.g === g).forEach(b => { delete S.unlocked[b.id]; })); checkBadges(true); render(); toast(a === 'signout' ? 'Signed out' : 'Test data off'); return; }
  if(a === 'reset'){ const keep = S.age; S = Object.assign(seed(), {age:keep}); resetJ(); persist(); checkBadges(true); render(); toast('Reset'); return; }
  if(a === 'demo'){ if(!S.test) return;
    if(v === 'points'){ S.balance += 250; S.lifetime += 250; }
    if(v === 'redeem'){ if(S.balance >= 500){ S.balance -= 500; S.redeemed += 500; } else { toast('Not enough points to use'); return; } }
    if(v === 'buy'){ S.purchases++; S.balance += 25; S.lifetime += 25; }
    if(v === 'member'){ S.joined = new Date(new Date(S.joined).getTime() - 90*864e5).toISOString(); }
    if(v === 'limit'){ S.fullLimits++; }
    if(v === 'xp'){ const b = lvl().i; S.xp += 200; const af = lvl().i; if(af > b) pend.push({k:'level', i:af}); pendXp += 200; }
    if(v === 'day'){ S.dayOffset++; dealDay = null; }
    if(v === 'dayreset'){ S.dayOffset = 0; dealDay = null; }
    persist(); checkBadges(); render(); }
});
document.addEventListener('submit', async e => {
  if(e.target.id === 'nickForm'){
    e.preventDefault();
    S.nick = document.getElementById('nickIn').value.replace(/[<>&"'`]/g,'').replace(/\s+/g,' ').trim().slice(0, 20); S.nickAsked = true; persist(); render(); toast(S.nick ? 'Saved' : 'Name cleared');
    return;
  }
  if(e.target.id === 'phoneForm'){
    e.preventDefault();
    const msg = document.getElementById('signinMsg'), d = document.getElementById('phoneIn').value.replace(/\D/g,''), ph = d.length === 11 && d[0] === '1' ? d.slice(1) : d;
    if(ph.length !== 10){ msg.textContent = 'Enter a 10-digit mobile number.'; return; }
    msg.textContent = 'Sending code...';
    const r = await ALPINE.start(ph);
    if(r && r.ok){ SI = {step:'code', phone:ph}; render(); } else { msg.textContent = (r && r.message) || 'Could not send a code. Try again.'; }
    return;
  }
  if(e.target.id === 'codeForm'){
    e.preventDefault();
    const msg = document.getElementById('signinMsg'), code = document.getElementById('codeIn').value.replace(/\D/g,'');
    if(code.length < 4){ msg.textContent = 'Enter the code from your text.'; return; }
    msg.textContent = 'Checking...';
    const r = await ALPINE.verify(SI.phone, code);
    if(r && r.ok){ r.phone = SI.phone; applyAccount(r); SI = {step:'phone', phone:''}; toast('Signed in'); render(); } else { msg.textContent = (r && r.message) || 'That code did not work. Try again.'; }
    return;
  }
  if(e.target.id === 'journalForm'){
    e.preventDefault(); readJ();
    const msg = document.getElementById('jMsg'), name = J.name.trim().replace(/\s+/g,' ');
    if(!name){ msg.textContent = 'Add the strain or product name.'; return; }
    if(J.how < 0){ msg.textContent = 'Pick how you tried it.'; return; }
    const how = METHODS[J.how][0], notes = J.notes.trim(), brand = J.brand.trim().replace(/\s+/g,' ');
    if(J.id){ const en = S.journal.find(x => x.id === J.id); if(en){ en.name = name; en.brand = brand; en.how = how; en.rating = J.rating; en.notes = notes; if(J.fav && !en.fav) en.favAt = Date.now(); en.fav = J.fav; } persist(); resetJ(); checkBadges(); render(); toast('Entry saved'); return; }
    const first = S.journal.length === 0, newStrain = !strainSet().some(s => s.toLowerCase() === name.toLowerCase()), newCat = !catSet().includes(methodCat(how));
    S.journal.push({id: Date.now(), name, brand, how, rating: J.rating, notes, fav: J.fav, favAt: J.fav ? Date.now() : 0});
    award('j-' + S.journal.length, 15, true); if(first) award('first-entry', 25); if(newStrain) award('strain-' + name.toLowerCase(), 5); if(newCat) award('cat-' + methodCat(how), 10);
    bumpWeek('entries'); resetJ(); checkBadges(); render(); return;
  }
});
window.addEventListener('hashchange', route);

/* ---------- celebration ---------- */
let cele = [], celeOpen = false;
function confetti(){ const cols = S.canna ? ['#D6302A','#F2B600','#1FA64A','#FFD93D','#45D46E'] : ['#8BDB63','#F2D272','#FFFFFF','#4FA82F','#D9A21B']; let s = '';
  for(let i = 0; i < 26; i++) s += `<i class="conf" style="--x:${Math.floor(Math.random()*100)}%;--r:${Math.floor(Math.random()*360)}deg;--d:${(2.4 + Math.random()*2).toFixed(1)}s;--dl:${(Math.random()*1.4).toFixed(1)}s;--c:${cols[i % 5]}"></i>`;
  return s; }
function celebrate(items){ cele = cele.concat(items); if(!celeOpen) showCele(); }
function showCele(){
  const el = document.getElementById('celebrate'), it = cele[0];
  if(!it){ el.hidden = true; celeOpen = false; return; }
  celeOpen = true; el.hidden = false;
  let eyebrow, title, text, medal;
  if(it.k === 'badge'){ eyebrow = 'Badge unlocked'; title = it.b.n; text = it.b.d; medal = medalSVG(GICON[it.b.g], TIERS[it.b.id], 124); }
  else { const L = LEVELS[it.i], nx = LEVELS[it.i + 1]; eyebrow = 'Level up'; title = 'You are now ' + L[0]; text = nx ? fmt(Math.max(0, nx[1] - S.xp)) + ' XP to ' + nx[0] + '.' : 'You reached the top level.'; medal = medalSVG('leaf', 'gold', 124); }
  const more = cele.length - 1;
  el.innerHTML = `<div class="cele-card" data-a="noop">${contour(77, 7)}${confetti()}<div class="eyebrow">${eyebrow}</div><div class="cele-medal">${medal}</div><h2 id="celeTitle">${esc(title)}</h2><p>${esc(text)}</p>
    <div class="stack"><button class="btn primary block" data-a="celenext">${more > 0 ? 'Next (' + more + ' more)' : 'Nice'}</button>${it.k === 'badge' ? '<button class="btn glass block" data-a="celebadges">See trophy case</button>' : ''}</div></div>`;
  el.setAttribute('data-a', 'celenext');
  const b = el.querySelector && el.querySelector('[data-a="celenext"]'); if(b && b.focus) b.focus();
}
document.addEventListener('keydown', e => { if(e.key === 'Escape' && celeOpen){ cele.shift(); showCele(); } });

/* ---------- age gate + boot ---------- */

    <div style="display:flex;gap:10px;width:100%"><button class="btn primary" style="flex:1" id="ageYes">Yes, I am 21+</button><button class="btn" style="flex:1" id="ageNo">No</button></div><p id="ageMsg" class="note" role="alert" style="color:rgba(234,246,227,.8)"></p></div>`;
  document.getElementById('ageYes').onclick = () => { S.age = true; persist(); g.hidden = true; };

}
document.getElementById('logoLink').innerHTML = logoHTML();
document.getElementById('menuTop').innerHTML = `<a class="iconbtn" href="#settings" aria-label="Settings">${ico('gear')}</a>` + (CONFIG.MENU_URL
  ? `<a class="btn small primary" href="${esc(CONFIG.MENU_URL)}" target="_blank" rel="noopener">Menu</a>`
  : `<button class="btn small primary" data-a="nolink">Menu</button>`);
applyTheme();
/* bring the old passport (v3) entries forward if present */
try{ const old = JSON.parse(localStorage.getItem('primo.app.v3') || 'null'); if(old && !S.journal.length && old.lessons){ S.lessons = Object.assign({}, old.lessons, S.lessons); S.played = Object.assign({}, old.played || {}, S.played); S.quizBest = Math.max(S.quizBest, old.quizBest || 0); S.memBest = S.memBest || old.memBest || 0; S.dashBest = Math.max(S.dashBest, old.dashBest || 0); S.age = S.age || !!old.age; } }catch(e){}
checkBadges(true);
gate();
route();
if(PWA){
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if(location.hash === '' || location.hash === '#home') render(); });
  window.addEventListener('appinstalled', () => { deferredInstall = null; render(); });
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
}
