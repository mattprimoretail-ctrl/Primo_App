<!doctype html>
<html lang="en">
<head>
<title>Primo Cannabis</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A2014">
<meta name="description" content="Primo Cannabis, Otis Orchards WA: daily deals, Primo Rewards points, games and badges.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Primo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}body{font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap">
<style>
/* Layout: dark forest brand header and floating tab bar frame a scrolling feed of layered cards. One loud moment per screen: a forest-green panel with terrain contour lines (points hero, deal of the day, celebrations). Gold is reserved for achievements. */
:root{
  --font-display:'Unbounded','Avenir Next','Segoe UI',system-ui,sans-serif;
  --font-body:'Figtree','Segoe UI',system-ui,sans-serif;
  --bg:#EDF2E8; --bg-glow:rgba(109,190,69,.26);
  --surface:#FFFFFF; --surface-2:#F4F8F0; --surface-3:#E3EBDC;
  --fg:#0E1C13; --muted:#52665A; --line:rgba(14,48,26,.10); --line-2:rgba(14,48,26,.22);
  --brand:#6DBE45; --brand-hi:#8BDB63; --brand-lo:#4FA82F; --accent-text:#2A6E18;
  --forest-1:#17502D; --forest-2:#0A2314; --forest-3:#0F3320; --hdr-bg:#0A2014;
  --gold:#C99417; --gold-hi:#F2D272; --gold-ink:#2B1C03; --gold-soft:rgba(217,162,27,.16); --gold-text:#8A6205;
  --bad:#B3392F; --ok-soft:rgba(109,190,69,.18);
  --shadow:0 1px 0 rgba(255,255,255,.9) inset,0 14px 30px -16px rgba(15,60,30,.38),0 2px 6px rgba(15,60,30,.06);
  --glass:rgba(255,255,255,.8); --tab-on:rgba(42,110,24,.13);
  --gl:max(16px, env(safe-area-inset-left, 0px)); --gr:max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#08150E; --bg-glow:rgba(109,190,69,.2); --surface:#0F2418; --surface-2:#13291C; --surface-3:#1B3526;
    --fg:#E9F3EA; --muted:#9BB3A2; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.16); --accent-text:#8BDB63;
    --gold-text:#E8BF55; --gold-soft:rgba(232,191,85,.14); --ok-soft:rgba(109,190,69,.16); --bad:#F08A7E; --hdr-bg:#07170E;
    --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 16px 30px -18px rgba(0,0,0,.8); --glass:rgba(11,28,18,.8); --tab-on:rgba(139,219,99,.16); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --bg:#08150E; --bg-glow:rgba(109,190,69,.2); --surface:#0F2418; --surface-2:#13291C; --surface-3:#1B3526;
    --fg:#E9F3EA; --muted:#9BB3A2; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.16); --accent-text:#8BDB63;
    --gold-text:#E8BF55; --gold-soft:rgba(232,191,85,.14); --ok-soft:rgba(109,190,69,.16); --bad:#F08A7E; --hdr-bg:#07170E;
    --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 16px 30px -18px rgba(0,0,0,.8); --glass:rgba(11,28,18,.8); --tab-on:rgba(139,219,99,.16); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(120% 46% at 50% -6%,var(--bg-glow),transparent 62%);background-repeat:no-repeat;color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;padding-block:0 128px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hdr-bg);z-index:20}
.app{max-width:560px;margin:0 auto;padding-left:var(--gl);padding-right:var(--gr)}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--font-display);font-weight:700;font-size:26px;line-height:1.15;letter-spacing:-.02em}
h2{font-family:var(--font-display);font-weight:700;font-size:16px;line-height:1.25;letter-spacing:-.01em}
h3{font-family:var(--font-body);font-weight:700;font-size:16px;line-height:1.3}
p{margin:0 0 10px}
a{color:var(--accent-text)}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand-hi);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--muted)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:19;background:linear-gradient(180deg,#0C2818,var(--hdr-bg));border-radius:0 0 22px 22px;box-shadow:0 10px 24px -14px rgba(5,20,10,.6)}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px var(--gr) 12px var(--gl)}
.logo{display:flex;align-items:center;text-decoration:none}
.logo-img{display:block;height:42px;width:auto}
.gate .logo-img{height:auto;width:min(240px,70vw)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:16px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);font:700 15px var(--font-body);text-decoration:none;cursor:pointer;transition:transform .12s ease,box-shadow .2s ease,background .2s ease;box-shadow:0 1px 0 rgba(255,255,255,.6) inset}
.btn:active{transform:translateY(1px) scale(.985)}
.btn.primary{background:linear-gradient(180deg,#8FE05F,#62B63A);color:#07200F;border-color:rgba(0,0,0,.12);box-shadow:0 10px 22px -10px rgba(79,168,47,.85),0 1px 0 rgba(255,255,255,.55) inset}
.btn.glass,.btn.dark{background:rgba(255,255,255,.12);color:#F2FAEC;border-color:rgba(255,255,255,.22);box-shadow:none;backdrop-filter:blur(6px)}
.btn.block{display:flex;width:100%}
.btn.small{min-height:38px;padding:0 14px;font-size:13px;border-radius:12px}
.top .btn.small{min-height:40px;padding:0 18px;border-radius:14px}
.chip{min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font:600 13.5px var(--font-body);cursor:pointer;display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:var(--fg);transition:transform .12s ease,background .2s}
.chip:active{transform:scale(.97)}
.chip svg{width:16px;height:16px;flex:none}
.chip[aria-pressed="true"]{background:linear-gradient(180deg,#8FE05F,#62B63A);color:#07200F;border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.link{background:none;border:0;padding:0;color:var(--accent-text);cursor:pointer;text-decoration:underline;font:600 13px var(--font-body)}

/* bars + tags */
.bar{height:9px;border-radius:99px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand-lo),var(--brand-hi));border-radius:99px;transform-origin:left;box-shadow:0 0 14px rgba(139,219,99,.45)}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--surface-3);color:var(--muted)}
.tag.gold{background:var(--gold-soft);color:var(--gold-text)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:12px}
.sec{margin-top:30px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-h a{font-size:13px;font-weight:700;text-decoration:none}
.page-h{margin:20px 0 6px}
.page-h p{color:var(--muted);margin-top:8px}
.back{display:inline-flex;align-items:center;gap:4px;margin-top:14px;font-weight:700;font-size:14px;text-decoration:none;min-height:36px}
.back svg{width:18px;height:18px}
.contour{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;color:rgba(139,219,99,.2)}

/* greeting row */
.greet{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:22px}
.greet-h{font-size:24px;margin-top:4px}
.pill-open{display:inline-flex;gap:8px;align-items:center;font-size:12.5px;font-weight:700;padding:7px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--brand);display:inline-block;box-shadow:0 0 0 0 rgba(109,190,69,.6);animation:ping 2.2s infinite}
.dot.off{background:var(--muted);animation:none}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(109,190,69,0)}100%{box-shadow:0 0 0 0 rgba(109,190,69,0)}}

/* hero */
.hero{position:relative;overflow:hidden;color:#EAF6E3;border-radius:28px;padding:24px 22px;margin-top:16px;background:radial-gradient(80% 90% at 100% 0%,rgba(109,190,69,.42),transparent 58%),linear-gradient(158deg,var(--forest-1),var(--forest-2));box-shadow:0 22px 44px -20px rgba(6,32,14,.75),inset 0 1px 0 rgba(255,255,255,.14)}
.hero>*:not(.contour){position:relative}
.hero .eyebrow{color:rgba(234,246,227,.7)}
.hero .big{font-family:var(--font-display);font-weight:800;font-size:clamp(40px,13.5vw,54px);line-height:1.05;letter-spacing:-.03em;margin:8px 0 4px;white-space:nowrap}
.hero .big.sm{font-size:clamp(32px,10.5vw,42px)}
.hero .big small{font-size:14px;letter-spacing:0;font-weight:600;margin-left:6px;opacity:.7}
.hero-h{font-size:24px;margin:10px 0 8px;color:#fff;max-width:15ch}
.hero-p{margin:0 0 18px;max-width:34ch;color:rgba(234,246,227,.82)}
.hero .row{font-size:13.5px;font-weight:600;margin:0 0 14px;color:rgba(234,246,227,.85)}
.hero .bar{background:rgba(255,255,255,.14)}
.hero-acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.status{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.14);color:#EAF6E3}
.cta-row{display:grid;grid-template-columns:1.15fr 1fr;gap:10px;margin-top:12px}
.cta-row .btn{padding:0 12px}

/* daily run */
.you{margin-top:12px}
.you-top{display:flex;align-items:center;gap:14px}
.ring{flex:none}
.ring-t{font:800 22px var(--font-display);fill:var(--fg)}
.ring-fg{animation:ringIn 1.1s cubic-bezier(.2,.7,.2,1) both}
@keyframes ringIn{from{stroke-dashoffset:var(--c)}}
.you-mid{flex:1;min-width:0}
.lvl{font-family:var(--font-display);font-weight:800;font-size:22px;line-height:1.15;letter-spacing:-.02em;margin:2px 0}
.streak{display:flex;flex-direction:column;align-items:flex-end;flex:none}
.streak-n{font-family:var(--font-display);font-weight:800;font-size:34px;line-height:1;color:var(--gold-text)}
.streak-l{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:.06em}
.streak-l svg{width:14px;height:14px;color:var(--gold)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:18px 0 16px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.wl{font-size:11px;font-weight:700;color:var(--muted)}
.wc{width:100%;max-width:40px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);color:#07200F}
.wc svg{width:55%;height:55%}
.wd.on .wc{background:linear-gradient(180deg,#8FE05F,#4FA82F);box-shadow:0 6px 14px -6px rgba(79,168,47,.8)}
.wd.today .wc{outline:2.5px solid var(--brand);outline-offset:2px}
.wd.fut .wc{opacity:.55}
.checked{display:flex;gap:10px;align-items:center;font-size:13.5px;font-weight:600;color:var(--accent-text);background:var(--ok-soft);padding:12px 14px;border-radius:14px}
.checked svg{width:18px;height:18px;flex:none}

/* deal feature card */
.dealx{position:relative;overflow:hidden;color:#EAF6E3;border-radius:26px;padding:20px;background:radial-gradient(70% 90% at 0% 100%,rgba(109,190,69,.35),transparent 60%),linear-gradient(160deg,var(--forest-1),var(--forest-2));box-shadow:0 20px 40px -20px rgba(6,32,14,.7),inset 0 1px 0 rgba(255,255,255,.12)}
.dealx>*:not(.contour){position:relative}
.dealx .wm{position:absolute;right:-6px;top:-14px;font:800 92px/1 var(--font-display);letter-spacing:-.04em;color:transparent;-webkit-text-stroke:1.5px rgba(139,219,99,.26);pointer-events:none;user-select:none}
.dealx-top{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.ptag{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18)}
.ptag.hot{background:linear-gradient(180deg,#F5DB84,#D9A21B);border-color:transparent;color:#2B1C03}
.dealx h3{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-.015em;color:#fff;max-width:14ch;line-height:1.2}
.dealx-body{display:flex;gap:16px;align-items:center;margin-top:16px}
.pct{font:800 58px/1 var(--font-display);letter-spacing:-.05em;color:var(--brand-hi);display:flex;align-items:flex-start;flex:none}
.pct small{font-size:24px;margin-top:6px;letter-spacing:0}
.pctw{flex:none}
.off{font:700 11px var(--font-body);letter-spacing:.24em;color:rgba(234,246,227,.8);margin-top:4px}
.dealx ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;min-width:0}
.dealx li{font-size:14px;line-height:1.4;color:rgba(234,246,227,.92);padding-left:16px;position:relative}
.dealx li::before{content:"";position:absolute;left:0;top:.5em;width:7px;height:7px;border-radius:50%;background:var(--brand-hi)}

/* generic lists */
.list{display:flex;flex-direction:column;gap:10px}
.row-link{display:flex;align-items:center;gap:14px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;text-decoration:none;color:var(--fg);width:100%;text-align:left;cursor:pointer;font:inherit;box-shadow:var(--shadow);transition:transform .12s ease}
.row-link:active{transform:scale(.985)}
.row-link .grow{flex:1;min-width:0}
.row-link .grow p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.chev{width:18px;height:18px;color:var(--muted);flex:none}
.ico-box{width:48px;height:48px;border-radius:15px;background:linear-gradient(150deg,#1E6B3C,#0F3A22);display:grid;place-items:center;color:var(--brand-hi);flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.ico-box svg{width:24px;height:24px}
.ico-box.gold{background:linear-gradient(150deg,#F5DB84,#D9A21B);color:#2B1C03}
.ico-box.teal{background:linear-gradient(150deg,#27A58B,#0F5E55);color:#E8FFF8}
.ico-box.lime{background:linear-gradient(150deg,#9BE36B,#4FA82F);color:#07200F}
.ico-box.sm{width:40px;height:40px;border-radius:12px}
.ico-box.sm svg{width:20px;height:20px}
.check{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;border:1.5px solid var(--line-2);color:transparent}
.check.on{background:linear-gradient(180deg,#8FE05F,#4FA82F);border-color:transparent;color:#07200F}
.check svg{width:16px;height:16px}
.ladder{display:flex;flex-direction:column}
.ladder .step{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ladder .step:first-child{border-top:0}
.ladder .pts{font-family:var(--font-display);font-weight:700;width:76px;flex:none}
.ladder .step.ready .pts{color:var(--gold-text)}

/* rail + shop tiles */
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 var(--gr) 0 var(--gl);margin:0 calc(var(--gr) * -1) 0 calc(var(--gl) * -1);padding:4px var(--gr) 14px var(--gl);scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rcard{position:relative;overflow:hidden;flex:none;width:200px;min-height:150px;scroll-snap-align:start;border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:#EAF6E3;justify-content:flex-end;box-shadow:0 16px 30px -16px rgba(6,32,14,.7),inset 0 1px 0 rgba(255,255,255,.14);transition:transform .12s ease}
.rcard:active{transform:scale(.98)}
.rcard>*:not(.contour){position:relative}
.rcard .rico{width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.16);display:grid;place-items:center;margin-bottom:auto}
.rcard .rico svg{width:22px;height:22px}
.rcard b{font-family:var(--font-display);font-weight:700;font-size:15px;line-height:1.2;letter-spacing:-.01em}
.rcard span:last-child{font-size:12.5px;opacity:.85}
.rcard .contour{color:rgba(255,255,255,.13)}
.g-gold .contour{color:rgba(43,28,3,.14)!important}
.g-lime .contour{color:rgba(7,32,15,.14)!important}
.g-forest{background:radial-gradient(90% 90% at 100% 0%,rgba(109,190,69,.4),transparent 60%),linear-gradient(160deg,var(--forest-1),var(--forest-2))}
.g-teal{background:linear-gradient(160deg,#1F9A82,#0B4B45)}
.g-gold{background:linear-gradient(160deg,#F2D272,#C99417);color:#2B1C03}
.g-gold .rico{background:rgba(43,28,3,.12)}
.g-lime{background:linear-gradient(160deg,#9BE36B,#3F9A25);color:#07200F}
.g-lime .rico{background:rgba(7,32,15,.12)}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.shop-t{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;background:var(--surface);border:1px solid var(--line);border-radius:20px;text-decoration:none;color:var(--fg);font-weight:700;font-size:13px;box-shadow:var(--shadow);transition:transform .12s ease;min-width:0;text-align:center}
.shop-t:active{transform:scale(.97)}
.shop-t svg{width:26px;height:26px;color:var(--accent-text)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;gap:4px;padding:14px 12px;background:var(--surface);border:1px solid var(--line);border-radius:20px;text-decoration:none;color:var(--fg);min-width:0;box-shadow:var(--shadow)}
.tile svg{width:22px;height:22px;color:var(--accent-text);margin-bottom:4px}
.tile b{font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:-.02em}
.tile span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:20px;min-width:0;box-shadow:var(--shadow)}
.stat b{display:block;font-family:var(--font-display);font-size:22px;font-weight:700;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}

/* quests */
.qrow{padding:14px 0;border-top:1px solid var(--line)}
.qrow:first-child{border-top:0}
.qrow .qh{display:flex;justify-content:space-between;gap:10px;margin-bottom:9px;font-weight:600;font-size:14px}
.qrow.done .qh{color:var(--accent-text)}
.joke{background:linear-gradient(160deg,var(--surface),var(--surface-2))}
.punch{margin:0;font-weight:700;color:var(--accent-text);animation:rise .4s both}

/* deals */
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days .chip{flex:none;flex-direction:column;gap:1px;min-height:56px;min-width:56px;justify-content:center;padding:0 10px;border-radius:18px}
.days .chip small{font-size:10px;font-weight:700;opacity:.7;letter-spacing:.06em;text-transform:uppercase}
.deal{display:flex;flex-direction:column;gap:6px}
.deal h3{font-size:18px}

/* lessons + quiz */
.lesson-body p,.lesson-body li{font-size:15.5px;max-width:65ch}
.lesson-body ul{padding-left:20px;margin:0 0 10px}
.lesson-body li{margin-bottom:6px}
.q{margin-top:18px}
.q h3{margin-bottom:12px;font-size:17px}
.opt{display:block;width:100%;text-align:left;min-height:52px;padding:12px 16px;margin-bottom:10px;border-radius:16px;border:1.5px solid var(--line-2);background:var(--surface);font:600 15px var(--font-body);cursor:pointer;box-shadow:var(--shadow);transition:transform .12s ease,border-color .2s}
.opt:active:not(:disabled){transform:scale(.985)}
.opt.ok{border-color:var(--brand);background:var(--ok-soft)}
.opt.no{border-color:var(--bad);animation:shake .35s}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.score-row{display:flex;justify-content:space-between;gap:10px;font-weight:700;margin:16px 0 10px;font-size:14px}
.result{text-align:center;padding:28px 18px}
.result .big{font-family:var(--font-display);font-size:54px;font-weight:800;line-height:1;letter-spacing:-.04em}
.res-name{font-family:var(--font-display);font-weight:800;font-size:38px;line-height:1.1;letter-spacing:-.03em;margin:8px 0}
.game-card{align-items:center}
.game-card .ico-box{width:56px;height:56px;border-radius:18px}
.game-card .ico-box svg{width:28px;height:28px}

/* memory + dash */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mcard{aspect-ratio:1/1.05;max-width:100%;border-radius:18px;border:1.5px solid var(--line-2);background:linear-gradient(160deg,var(--forest-1),var(--forest-2));display:grid;place-items:center;padding:6px;font:700 13px var(--font-body);text-align:center;overflow-wrap:anywhere;cursor:pointer;color:var(--brand-hi);box-shadow:var(--shadow)}
.mcard svg{width:30px;height:30px}
.mcard.open{background:var(--surface);color:var(--fg);border-color:var(--brand);animation:pop .22s ease-out}
.mcard.done{background:linear-gradient(180deg,#8FE05F,#4FA82F);color:#07200F;border-color:transparent}
@keyframes pop{from{transform:scale(.88)}to{transform:scale(1)}}
.tbar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-bottom:12px}
.tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold),var(--gold-hi));transition:width 1s linear}
.arena{position:relative;height:340px;max-width:100%;border-radius:24px;background:radial-gradient(80% 70% at 50% 100%,rgba(109,190,69,.3),transparent 70%),linear-gradient(170deg,var(--forest-1),var(--forest-2));overflow:hidden;touch-action:manipulation;box-shadow:var(--shadow)}
.leaf{position:absolute;width:58px;height:58px;border:0;background:none;color:var(--brand-hi);padding:0;cursor:pointer;animation:pop .18s ease-out;filter:drop-shadow(0 0 10px rgba(139,219,99,.7))}
.leaf.gold{color:var(--gold-hi);filter:drop-shadow(0 0 12px rgba(242,210,114,.9))}
.leaf svg{width:100%;height:100%}
.pop{position:absolute;font:800 18px var(--font-display);color:#fff;pointer-events:none;animation:floatUp .6s ease-out both}
.pop.gold{color:var(--gold-hi)}
@keyframes floatUp{to{transform:translateY(-34px);opacity:0}}

/* badges */
.badge-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:18px 12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:22px;min-width:0;box-shadow:var(--shadow)}
.badge.on{background:radial-gradient(90% 70% at 50% 0%,var(--gold-soft),transparent 70%),var(--surface);border-color:rgba(201,148,23,.4)}
.badge h3{font-size:14.5px}
.badge p{font-size:12.5px;color:var(--muted);margin:0}
.badge .bar{width:100%;height:7px}
.badge .meta{font-size:12px;font-weight:700;margin-top:auto;color:var(--muted)}
.badge.on .meta{color:var(--gold-text)}
.hexm{display:block;flex:none;filter:drop-shadow(0 8px 10px rgba(15,50,25,.25))}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:12px 8px}
.stamp{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;text-align:center;min-width:0}

/* journal + team + forms */
.field{display:flex;flex-direction:column;gap:8px;font-weight:700;font-size:13px}
.field .chips{font-weight:600}
input[type=text],textarea{width:100%;padding:0 16px;border-radius:14px;border:1.5px solid var(--line-2);background:var(--surface-2);color:var(--fg);font:500 15px var(--font-body);min-height:48px}
textarea{min-height:100px;padding:12px 16px;line-height:1.5;resize:vertical}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px rgba(109,190,69,.2)}
.form-row{display:flex;gap:8px}
.stars{display:flex;gap:2px}
.star{width:46px;height:46px;border:0;background:none;color:var(--gold);padding:8px;cursor:pointer}
.star svg,.stars-ro svg{width:100%;height:100%}
.stars-ro{display:flex;gap:1px;width:90px;flex:none;color:var(--gold)}
.stars-ro svg{width:18px;height:18px}
.entry{display:flex;flex-direction:column;gap:10px}
.entry-head{display:flex;gap:12px;align-items:center}
.entry-head .grow{flex:1;min-width:0}
.entry-head h3{overflow-wrap:anywhere}
.entry .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-top:2px}
.entry .notes{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.entry .acts{display:flex;gap:8px;flex-wrap:wrap}
.member{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.member:first-child{border-top:0;padding-top:0}
.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font:700 16px var(--font-display);color:#07200F;flex:none}
.about-hero{position:relative;overflow:hidden;color:#EAF6E3;border-radius:26px;padding:24px 22px;margin-top:16px;background:radial-gradient(80% 90% at 100% 0%,rgba(109,190,69,.4),transparent 60%),linear-gradient(158deg,var(--forest-1),var(--forest-2));box-shadow:0 20px 40px -20px rgba(6,32,14,.7),inset 0 1px 0 rgba(255,255,255,.12)}
.about-hero>*:not(.contour){position:relative}
.about-hero h2{font-size:22px;color:#fff;max-width:16ch;margin:8px 0 10px;line-height:1.2}
.about-hero p{margin:0;color:rgba(234,246,227,.85)}
.legal{font-size:12px;color:var(--muted);margin-top:30px}
details.preview{border:1px dashed var(--line-2);border-radius:18px;padding:14px 16px}
details.preview summary{cursor:pointer;font-weight:700;font-size:14px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:18;padding:0 var(--gr) calc(10px + env(safe-area-inset-bottom,0px)) var(--gl);pointer-events:none}
.tabs-in{pointer-events:auto;max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px;border-radius:26px;background:var(--glass);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1px solid var(--line-2);box-shadow:0 18px 36px -14px rgba(5,25,12,.5)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;border-radius:20px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:700;min-height:54px;transition:background .2s,color .2s}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent-text);background:var(--tab-on)}
.tab[aria-current="page"] svg{stroke-width:2.3}

/* age gate */
.gate{position:fixed;inset:0;z-index:40;overflow:hidden;color:#EAF6E3;background:radial-gradient(80% 60% at 50% 0%,rgba(109,190,69,.35),transparent 65%),linear-gradient(170deg,var(--forest-1),var(--forest-2) 70%);display:flex;align-items:center;justify-content:center;padding:24px max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px))}
.gate .contour{color:rgba(139,219,99,.16)}
.gate .box{position:relative;max-width:380px;text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center}
.gate h1{color:#fff;font-size:24px}
.gate p{color:rgba(234,246,227,.8)}
.gate .btn:not(.primary){background:rgba(255,255,255,.1);color:#EAF6E3;border-color:rgba(255,255,255,.22)}

/* toast + celebration */
.toast{position:fixed;left:50%;bottom:calc(98px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#0A2014;color:#EAF6E3;padding:12px 18px;border-radius:99px;font-weight:700;font-size:14px;z-index:60;max-width:calc(100vw - 32px);text-align:center;transition:opacity .2s,transform .2s;box-shadow:0 14px 30px -10px rgba(0,0,0,.6);border:1px solid rgba(139,219,99,.3);display:flex;gap:8px;align-items:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
.tdot{width:8px;height:8px;border-radius:50%;background:var(--brand-hi);flex:none}
.cele{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px max(24px,env(safe-area-inset-right,0px)) 24px max(24px,env(safe-area-inset-left,0px));background:rgba(4,16,9,.78);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fade .25s both}
.cele-card{position:relative;overflow:hidden;width:min(360px,100%);text-align:center;color:#EAF6E3;border-radius:30px;padding:28px 22px 22px;background:radial-gradient(90% 60% at 50% 0%,rgba(242,210,114,.28),transparent 65%),linear-gradient(165deg,var(--forest-1),var(--forest-2));box-shadow:0 30px 60px -20px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.16);animation:cardIn .5s cubic-bezier(.2,.9,.25,1.2) both}
.cele-card>*:not(.contour){position:relative}
.cele-card .eyebrow{color:var(--gold-hi)}
.cele-card h2{font-size:22px;color:#fff;margin:8px 0 6px;line-height:1.2}
.cele-card p{color:rgba(234,246,227,.85);margin:0 0 18px}
.cele-medal{display:flex;justify-content:center;margin:12px 0 8px;animation:medalIn .7s .15s cubic-bezier(.2,.9,.25,1.3) both}
.cele-medal .hexm{filter:drop-shadow(0 0 26px rgba(242,210,114,.65))}
.conf{position:absolute;top:-12px;left:var(--x);width:9px;height:14px;border-radius:2px;background:var(--c);opacity:0;animation:fall var(--d) var(--dl) linear infinite;transform:rotate(var(--r))}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(var(--r))}100%{opacity:0;transform:translateY(420px) rotate(calc(var(--r) + 540deg))}}
@keyframes fade{from{opacity:0}}
@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.92)}}
@keyframes medalIn{from{opacity:0;transform:scale(.4) rotate(-18deg)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
#view.enter>*{animation:rise .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 50ms)}
#view.enter .bar i{animation:fillIn .9s .2s cubic-bezier(.2,.7,.2,1) both}
@keyframes fillIn{from{transform:scaleX(0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.conf{display:none}}
@media (max-width:380px){.pct{font-size:48px}.cta-row{grid-template-columns:1fr}}
.install{display:flex;gap:12px;align-items:flex-start;margin-top:16px;position:relative}
.install .grow{flex:1;min-width:0}
.install h3{margin:0}
.install .x{position:absolute;top:6px;right:6px;width:36px;height:36px;border:0;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.install .x svg{width:18px;height:18px}
.hero-acts .btn.small{min-height:36px}
.heart{flex:none;width:44px;height:44px;border:0;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center;border-radius:50%}
.heart svg{width:24px;height:24px}
.heart.on{color:#D6456B}
.heart.on svg{fill:currentColor}
.chip svg{flex:none}
.fav .acts{display:flex;gap:8px;flex-wrap:wrap}

/* ===== settings ===== */
#menuTop{display:flex;align-items:center;gap:8px}
.iconbtn{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.12);color:#EAF6E3;cursor:pointer;text-decoration:none}
.iconbtn svg{width:20px;height:20px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:16px;background:var(--surface-3)}
.seg button{min-height:42px;border:0;border-radius:12px;background:none;font:700 14px var(--font-body);color:var(--muted);cursor:pointer}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--fg);box-shadow:0 2px 8px rgba(0,0,0,.14)}
.setrow{display:flex;align-items:center;gap:14px;justify-content:space-between}
.setrow .grow{flex:1;min-width:0}
.setrow h3{margin:0 0 2px}
.switch{flex:none;width:56px;height:32px;border-radius:99px;border:0;background:var(--surface-3);position:relative;cursor:pointer;transition:background .2s;box-shadow:inset 0 0 0 1px var(--line-2)}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .2s}
.switch[aria-checked="true"]{background:linear-gradient(90deg,#1FA64A,#128A38)}
.switch[aria-checked="true"]::after{transform:translateX(24px)}
.rasta-chip{display:block;height:8px;border-radius:99px;background:linear-gradient(90deg,#D6302A 0 33.34%,#F2B600 33.34% 66.67%,#1FA64A 66.67%);margin-top:10px;max-width:160px}

/* ===== canna theme: rasta red, gold and green, with leaves ===== */
:root[data-style="canna"]{ --bg:#FFF3D1; --bg-glow:rgba(255,190,0,.34); --surface:#FFFCF2; --surface-2:#FFF1C9; --surface-3:#F5E0A0;

  --brand:#1FA64A; --brand-hi:#45D46E; --brand-lo:#128A38; --accent-text:#0C7A30;
  --forest-1:#0F8A3C; --forest-2:#06351A; --forest-3:#0A5A28; --hdr-bg:#16100A;
  --gold:#F2B600; --gold-hi:#FFD93D; --gold-ink:#2B1C03; --gold-soft:rgba(242,182,0,.22); --gold-text:#8A5600;
  --bad:#D6302A; --ok-soft:rgba(31,166,74,.16);
  --shadow:0 1px 0 rgba(255,255,255,.8) inset,0 14px 30px -16px rgba(90,50,0,.4),0 2px 6px rgba(90,50,0,.08);
  --glass:rgba(255,247,224,.84); --tab-on:rgba(31,166,74,.2); }
@media (prefers-color-scheme: dark){ :root[data-style="canna"]:not([data-theme="light"]){ --bg:#0F0A05; --bg-glow:rgba(242,182,0,.16); --surface:#1B130A; --surface-2:#22180D; --surface-3:#33261A;
    --fg:#FFF3D6; --muted:#CDB88C; --line:rgba(255,235,190,.1); --line-2:rgba(255,235,190,.2); --accent-text:#5BE17F;
    --gold-text:#FFD93D; --gold-soft:rgba(255,217,61,.15); --ok-soft:rgba(69,212,110,.16); --bad:#FF8A80; --hdr-bg:#0A0705;
    --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 16px 30px -18px rgba(0,0,0,.85); --glass:rgba(24,17,9,.84); --tab-on:rgba(91,225,127,.2); color-scheme:dark; } }
:root[data-style="canna"][data-theme="dark"]{ --bg:#0F0A05; --bg-glow:rgba(242,182,0,.16); --surface:#1B130A; --surface-2:#22180D; --surface-3:#33261A;
    --fg:#FFF3D6; --muted:#CDB88C; --line:rgba(255,235,190,.1); --line-2:rgba(255,235,190,.2); --accent-text:#5BE17F;
    --gold-text:#FFD93D; --gold-soft:rgba(255,217,61,.15); --ok-soft:rgba(69,212,110,.16); --bad:#FF8A80; --hdr-bg:#0A0705;
    --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 16px 30px -18px rgba(0,0,0,.85); --glass:rgba(24,17,9,.84); --tab-on:rgba(91,225,127,.2); color-scheme:dark; }

function medalSVG(icon, tier, size){

/* terrain contour lines, drawn from a seed */
const CONT = {};
function contour(seed, n){
  n = n || 8; const key = seed + ':' + n; if(CONT[key]) return CONT[key];
  const r = mulberry32(seed * 9973 + 7), cx = 200 + (r() - .5) * 160, cy = 150 + (r() - .5) * 100, N = 14, mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  let d = '';
  for(let k = 0; k < n; k++){
    const rad = 20 + k * 24, ph = r() * 6.28, ph2 = r() * 6.28, pts = [];
    for(let j = 0; j < N; j++){ const th = j / N * 6.2832, rr = rad * (1 + .13 * Math.sin(3 * th + ph) + .07 * Math.sin(5 * th + ph2)); pts.push([cx + rr * 1.35 * Math.cos(th), cy + rr * Math.sin(th)]); }
    const m = mid(pts[N - 1], pts[0]); let s = 'M' + m[0].toFixed(1) + ' ' + m[1].toFixed(1);
    for(let j = 0; j < N; j++){ const q = mid(pts[j], pts[(j + 1) % N]); s += 'Q' + pts[j][0].toFixed(1) + ' ' + pts[j][1].toFixed(1) + ' ' + q[0].toFixed(1) + ' ' + q[1].toFixed(1); }
    d += `<path d="${s}Z"/>`;
  }
  return CONT[key] = `<svg class="contour" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true">${d}</svg>`;
}
function greet(){
  const h = (+new Intl.DateTimeFormat('en-US', {timeZone:'America/Los_Angeles', hour:'numeric', hour12:false}).format(new Date())) % 24;
  return h < 5 ? 'Late night' : h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
}

function flush(){
  const texts = [], cel = [];
  pend.forEach(p => { if(p.k === 'badge' || p.k === 'level') cel.push(p); else texts.push(p.t); });
  const xp = pendXp; pend = []; pendXp = 0;
  const parts = []; if(xp) parts.push('+' + xp + ' XP'); texts.forEach(t => parts.push(t));
  if(cel.length > 3) parts.push('+' + (cel.length - 3) + ' more unlocked');
  if(parts.length) toast(parts.slice(0,3).join(' · ') + (parts.length > 3 ? ' · +' + (parts.length - 3) + ' more' : ''));
  if(cel.length) celebrate(cel.slice(0, 3));
}

}

function openStatus(){
  const parts = new Intl.DateTimeFormat('en-US', {timeZone:'America/Los_Angeles', weekday:'short', hour:'numeric', minute:'numeric', hour12:false}).formatToParts(new Date());
  const get = t => parts.find(p => p.type === t).value;
  const wd = get('weekday'), h = (+get('hour') % 24) + (+get('minute')) / 60;
  const hoursFor = d => d === 'Sun' ? CONFIG.OPEN.sunday : CONFIG.OPEN.weekday;
  const t12 = x => (x % 12 || 12) + (x < 12 || x === 24 ? ' AM' : ' PM');
  const [o, c] = hoursFor(wd);
  if(h >= o && h < c) return {open:true, text:'Open until ' + t12(c)};
  if(h < o) return {open:false, text:'Opens today at ' + t12(o)};
  const tomorrow = DAYS[(DAYS.indexOf(wd) + 1) % 7];
  return {open:false, text:'Opens tomorrow at ' + t12(hoursFor(tomorrow)[0])};
}

function dashRun(){
  D = {score:0, left:30, fin:false}; render();
  const arena = document.getElementById('arena');
  const spawn = () => { if(!arena) return; const gold = Math.random() < .17, b = document.createElement('button');
    b.className = 'leaf' + (gold?' gold':''); b.dataset.a = 'leaf'; b.dataset.v = gold ? 3 : 1; b.setAttribute('aria-label', gold ? 'Gold leaf' : 'Leaf');
    b.style.left = (Math.random()*(arena.clientWidth-58)) + 'px'; b.style.top = (Math.random()*(arena.clientHeight-58)) + 'px'; b.innerHTML = leafSVG();
    arena.appendChild(b); timers.push(setTimeout(() => b.remove(), 1400)); };

function dashEnd(){

  else { const L = LEVELS[it.i], nx = LEVELS[it.i + 1]; eyebrow = 'Level up'; title = 'You are now ' + L[0]; text = nx ? fmt(Math.max(0, nx[1] - S.xp)) + ' XP to ' + nx[0] + '.' : 'You reached the top level.'; medal = medalSVG('leaf', 'gold', 124); }
  const more = cele.length - 1;
  el.innerHTML = `<div class="cele-card" data-a="noop">${contour(77, 7)}${confetti()}<div class="eyebrow">${eyebrow}</div><div class="cele-medal">${medal}</div><h2 id="celeTitle">${esc(title)}</h2><p>${esc(text)}</p>
    <div class="stack"><button class="btn primary block" data-a="celenext">${more > 0 ? 'Next (' + more + ' more)' : 'Nice'}</button>${it.k === 'badge' ? '<button class="btn glass block" data-a="celebadges">See trophy case</button>' : ''}</div></div>`;
  el.setAttribute('data-a', 'celenext');
  const b = el.querySelector && el.querySelector('[data-a="celenext"]'); if(b && b.focus) b.focus();
}
document.addEventListener('keydown', e => { if(e.key === 'Escape' && celeOpen){ cele.shift(); showCele(); } });

/* ---------- age gate + boot ---------- */
function gate(){
  const g = document.getElementById('gate');
  if(S.age){ g.hidden = true; return; }
  g.hidden = false;
  g.innerHTML = contour(9, 10) + `<div class="box">${logoHTML()}<h1>Are you 21 or older?</h1><p style="margin:0">Primo Cannabis is for adults only. Please confirm your age to continue.</p>
    <div style="display:flex;gap:10px;width:100%"><button class="btn primary" style="flex:1" id="ageYes">Yes, I am 21+</button><button class="btn" style="flex:1" id="ageNo">No</button></div><p id="ageMsg" class="note" role="alert" style="color:rgba(234,246,227,.8)"></p></div>`;
  document.getElementById('ageYes').onclick = () => { S.age = true; persist(); g.hidden = true; };
  document.getElementById('ageNo').onclick = () => { document.getElementById('ageMsg').textContent = 'You must be 21 or older to use this app.'; };
}
document.getElementById('logoLink').innerHTML = logoHTML();
document.getElementById('menuTop').innerHTML = `<a class="iconbtn" href="#settings" aria-label="Settings">${ico('gear')}</a>` + (CONFIG.MENU_URL
  ? `<a class="btn small primary" href="${esc(CONFIG.MENU_URL)}" target="_blank" rel="noopener">Menu</a>`
  : `<button class="btn small primary" data-a="nolink">Menu</button>`);
applyTheme();
/* bring the old passport (v3) entries forward if present */
try{ const old = JSON.parse(localStorage.getItem('primo.app.v3') || 'null'); if(old && !S.journal.length && old.lessons){ S.lessons = Object.assign({}, old.lessons, S.lessons); S.played = Object.assign({}, old.played || {}, S.played); S.quizBest = Math.max(S.quizBest, old.quizBest || 0); S.memBest = S.memBest || old.memBest || 0; S.dashBest = Math.max(S.dashBest, old.dashBest || 0); S.age = S.age || !!old.age; } }catch(e){}
checkBadges(true);
gate();
route();
if(PWA){
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if(location.hash === '' || location.hash === '#home') render(); });
  window.addEventListener('appinstalled', () => { deferredInstall = null; render(); });
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
}

</script>
<noscript>Primo Cannabis needs JavaScript to run.</noscript>
</body>
