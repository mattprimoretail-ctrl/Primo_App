<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Primo rewards check</title>
<style>body{font:16px/1.5 system-ui,sans-serif;margin:0;padding:20px;max-width:640px;margin-inline:auto;background:#f4f7f2;color:#142014}h1{font-size:22px}label{display:block;font-weight:600;margin:14px 0 4px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #9ab09a;border-radius:10px;font:inherit}button{margin:10px 8px 0 0;padding:12px 16px;border:0;border-radius:10px;background:#1f7a3a;color:#fff;font:600 16px system-ui}pre{white-space:pre-wrap;word-break:break-word;background:#fff;border:1px solid #cfdccf;border-radius:10px;padding:12px;font-size:13px;min-height:80px}</style></head>
<body><h1>Primo rewards check</h1>
<p>Owner tool. It only works with your secret check password, and it shows nothing personal.</p>
<label for="api">Server address</label><input id="api" autocomplete="off">
<label for="tok">Your DIAG_TOKEN</label><input id="tok" type="password" autocomplete="off" autocapitalize="off" autocorrect="off">
<label for="ph">Phone (only for the text test)</label><input id="ph" inputmode="tel" placeholder="10 digits" autocomplete="off">
<label for="pg">Page to read (button 4)</label><input id="pg" value="/swagger/index.html" autocomplete="off" autocapitalize="off">
<button id="b1">1. Find Alpine's addresses</button><button id="b2">2. Probe addresses</button><button id="b4">4. Read Alpine reference page</button><button id="b3">3. Send test text</button><button id="cp" style="background:#555">Copy result</button>
<pre id="out">Results show here.</pre>
<script src="config.js"></script>
<script>
var api=document.getElementById('api'),out=document.getElementById('out');
api.value=(window.PRIMO_CONFIG&&window.PRIMO_CONFIG.API_URL)||'';
function run(body){out.textContent='Working...';fetch(api.value.trim(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.text()}).then(function(t){try{t=JSON.stringify(JSON.parse(t),null,2)}catch(e){}out.textContent=t}).catch(function(e){out.textContent='Could not reach the server: '+e.message})}
function tok(){return document.getElementById('tok').value.trim()}
document.getElementById('b1').onclick=function(){run({action:'swagger',token:tok()})};
document.getElementById('b2').onclick=function(){run({action:'probe',token:tok()})};
document.getElementById('b4').onclick=function(){run({action:'page',path:document.getElementById('pg').value.trim()||'/swagger/index.html',token:tok()})};
document.getElementById('b3').onclick=function(){run({action:'diagstart',phone:document.getElementById('ph').value.replace(/\D/g,''),token:tok()})};
document.getElementById('cp').onclick=function(){navigator.clipboard&&navigator.clipboard.writeText(out.textContent).then(function(){document.getElementById('cp').textContent='Copied'}).catch(function(){})};
</script></body></html>
